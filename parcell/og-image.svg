<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d14"/>
      <stop offset="0.5" stop-color="#141829"/>
      <stop offset="1" stop-color="#0e1220"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#e8c97a"/>
    </linearGradient>
    <radialGradient id="halo1" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.1" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond dégradé + halos ambient -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo1)"/>
  <rect width="1200" height="630" fill="url(#halo2)"/>

  <!-- Cadre subtil -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Logo Y en haut à gauche -->
  <g transform="translate(80, 90)">
    <rect width="80" height="80" rx="18" fill="#0a0d14" stroke="url(#gold)" stroke-width="1.5"/>
    <path d="M18 18 L40 50 L62 18 L72 18 L46 55 L46 68 L34 68 L34 55 L8 18 Z" fill="url(#gold)"/>
  </g>
  <text x="180" y="140" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700" fill="#e4e8f2" letter-spacing="-1">Yrow</text>
  <text x="180" y="168" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#7e8a9e">Investissement locatif simplifié</text>

  <!-- Titre principal -->
  <text x="80" y="330" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="76" font-weight="800" fill="#f8fafc" letter-spacing="-2">Simulateur de rentabilité</text>
  <text x="80" y="410" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="76" font-weight="800" fill="url(#gold)" letter-spacing="-2">locative gratuit</text>

  <!-- Sous-titre -->
  <text x="80" y="470" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Rendement net · Mensualité · Cashflow · 30 secondes</text>

  <!-- Badge "Gratuit" bas-droit -->
  <g transform="translate(880, 510)">
    <rect x="0" y="0" width="240" height="60" rx="12" fill="rgba(45,212,191,0.10)" stroke="rgba(45,212,191,0.35)" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="6" fill="#2dd4bf"/>
    <text x="55" y="38" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#2dd4bf">Gratuit · Sans inscription</text>
  </g>

  <!-- URL bas-gauche -->
  <text x="80" y="560" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="500" fill="#c9a84c">yrow.fr</text>
</svg>
